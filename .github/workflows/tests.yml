name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_mysql_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      ConnectionStrings__testmysql: 'Server=127.0.0.1;Port=3306;User ID=root;Password=test_mysql_password'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore packages
        run: dotnet restore AutoService.slnx
      - name: Check code formatting
        run: dotnet format AutoService.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build AutoService.slnx --configuration Release --no-restore
      - name: Run tests
        run: dotnet test tests/AutoService.Tests --configuration Release --no-build --logger "trx;LogFileName=mysql.trx" --results-directory TestResults
      - name: Test Aspire orchestration
        run: dotnet test tests/AutoService.AspireTests --configuration Release --no-build --logger "trx;LogFileName=aspire.trx" --results-directory TestResults
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
